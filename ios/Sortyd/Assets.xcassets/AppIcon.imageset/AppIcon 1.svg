<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Primary gradient: violet → cyan -->
    <linearGradient id="barFull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6FFF"/>
      <stop offset="100%" stop-color="#3ECFFF"/>
    </linearGradient>
    <linearGradient id="barMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6FFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3ECFFF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="barLow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6FFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3ECFFF" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="bgIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13141F"/>
      <stop offset="100%" stop-color="#0C0D16"/>
    </linearGradient>
  </defs>

  <!-- ── App icon background ── -->
  <rect x="0" y="0" width="160" height="160" rx="36" fill="url(#bgIcon)"/>

  <!-- ── Subtle dot grid ── -->
  <circle cx="50"  cy="50"  r="1" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="80"  cy="50"  r="1" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="110" cy="50"  r="1" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="50"  cy="80"  r="1" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="80"  cy="80"  r="1" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="110" cy="80"  r="1" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="50"  cy="110" r="1" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="80"  cy="110" r="1" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="110" cy="110" r="1" fill="#FFFFFF" opacity="0.04"/>

  <!-- ── Habit bar 1 — 100% ── -->
  <rect x="30" y="40" width="100" height="14" rx="6" fill="#1C1E30"/>
  <rect x="30" y="40" width="100" height="14" rx="6" fill="url(#barFull)"/>
  <!-- completion dot -->
  <circle cx="130" cy="47" r="10"  fill="#13141F" stroke="#7C6FFF" stroke-width="2.5"/>
  <circle cx="130" cy="47" r="5"  fill="#3ECFFF"/>

  <!-- ── Habit bar 2 — 72% ── -->
  <rect x="30" y="65" width="100" height="14" rx="6" fill="#1C1E30"/>
  <rect x="30" y="65" width="72"  height="14" rx="6" fill="url(#barMid)"/>

  <!-- ── Habit bar 3 — 40% ── -->
  <rect x="30" y="90" width="100" height="14" rx="6" fill="#1C1E30"/>
  <rect x="30" y="90" width="40"  height="14" rx="6" fill="url(#barLow)"/>
  

  <!-- ── Ghost wordmark inside icon ── -->
  <text x="80" y="134"
    text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="16"
    font-weight="200"
    fill="#FFFFFF"
    opacity="0.65"
    letter-spacing="5">sortyd</text>
  


</svg>